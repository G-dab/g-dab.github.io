<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ or .Title .Site.Title }}{{ if ne .Kind "home" }} | {{ .CurrentSection.Title }}{{ end }}</title>
  <!-- global stylesheet -->
  {{ $globalStyle := resources.Get "css/global.css" | toCSS | minify }}
  <link rel="stylesheet" href="{{ $globalStyle.RelPermalink }}">
  <!-- page-specific stylesheet -->
  {{ block "style" . }}{{ end }}
</head>

<body>
  <!-- set up content -->
  {{ block "page" . }}{{ end }}
</body>
</html>
