<div class="container">
  {{ with .Params.longImage }}
  <img src="{{ . }}" alt="Long Image" class="project-long-image">
  {{ end }}
  <h1 class="project-title">{{ .Title }}</h1>
  <div class="project-author-container">
    {{ with .Params.author }}
      {{ $len := len . }}
      {{ range $index, $author := . }}
        <p class="project-author">{{ $author }}{{ if ne (add $index 1) $len }},{{ end }}</p>
      {{ end }}
    {{ end }}
  </div>
  <div class="project-content">
    {{ .Content }}
  </div>
</div>
