{{ define "style"}}
  {{ $headerStyle := resources.Get "css/header_style.css" | toCSS | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $headerStyle.RelPermalink }}" integrity="{{ $headerStyle.Data.Integrity }}">
{{ end }}

{{ define "page" }}
  {{ partial "header.html" . }}
  <div class="container">
    {{ .Content }}
  </div>
{{ end }}
